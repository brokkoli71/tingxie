<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TingXie</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f1ede2">
<meta name="application-name" content="TingXie">
<!-- iOS ignores the manifest, so name and icon are set separately here. -->
<meta name="apple-mobile-web-app-title" content="TingXie">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f1ede2;
    --paper-line: #b9c3cf;
    --ink: #211f1a;
    --ink-soft: #57534a;
    --seal: #b3352a;
    --seal-dark: #8c2a21;
    --jade: #3d6a55;
    --jade-soft: #e4ede8;
    --card: #fbf9f3;
    --shadow: rgba(33,31,26,0.14);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: center;
    background-color: var(--paper);
    background-attachment: local;
    opacity: 1;
  }
  body::before{ content:none; }
  .bg-wash{
    position: fixed; inset:0; z-index:-1;
    background: var(--paper);
  }
  .grid-wash{
    position: fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(rgba(185,195,207,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(185,195,207,0.35) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, black 40%, transparent 90%);
  }
  .wrap{ width:100%; max-width: 540px; }

  header{ margin-bottom: 12px; }
  h1{
    font-family: "Noto Serif SC", "Source Serif 4", serif;
    font-weight: 700;
    font-size: 40px;
    margin: 0 0 4px;
    display:flex;
    align-items:baseline;
    gap: 12px;
  }
  h1 .latin{
    font-family: "Source Serif 4", serif;
    font-size: 17px;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
  }
  .stats{
    font-family:"JetBrains Mono", monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .stats b{ color: var(--ink); font-weight:600; }

  .boxes{ display:flex; gap:6px; margin-top:10px; }
  .box-stamp{
    width: 34px; height: 34px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 3px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-soft);
    background: transparent;
  }
  .box-stamp .n{ font-size: 13px; font-weight:600; color: var(--ink); line-height:1;}
  .box-stamp.filled{ border-color: var(--seal); color: var(--seal-dark); }
  .box-stamp.filled .n{ color: var(--seal); }
  .box-stamp.mastered{ border-color: var(--jade); }
  .box-stamp.mastered .n{ color: var(--jade); }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px var(--shadow), 0 1px 0 rgba(255,255,255,0.5) inset;
    padding: 26px 24px 24px;
    position: relative;
    border: 1px solid rgba(33,31,26,0.06);
  }
  .tag{
    position:absolute;
    top: -12px; left: 22px;
    background: var(--card);
    border: 1.5px solid var(--seal);
    color: var(--seal-dark);
    font-family:"JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 4px;
    transform: rotate(-2.5deg);
    box-shadow: 1px 1px 0 rgba(179,53,42,0.15);
  }

  .controls-row{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 10px 0 20px;
  }
  .play-btn{
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--seal);
    color: #fdf6ee;
    border: none;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(179,53,42,0.35);
    transition: transform 0.12s ease;
    flex-shrink:0;
  }
  .play-btn:active{ transform: scale(0.93); }
  .play-btn svg{ width: 24px; height:24px; }

  .rate-toggle{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .rate-toggle.active{
    border-color: var(--jade);
    color: var(--jade);
    background: var(--jade-soft);
  }
  /* Handwriting area: one 米字格 cell per character, like squared practice
     paper. Answers are drawn, not typed — writing is the point of the app. */
  /* Compact top bar: title, the one number that matters, and a disclosure for
     everything that isn't needed while answering a card. */
  .topbar{
    display:flex;
    align-items:baseline;
    gap: 12px;
    margin-bottom: 10px;
  }
  .topbar .stats{ margin: 0; }
  .details-toggle{
    margin-left:auto;
    font-family:"JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1;
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 50%;
    width: 28px; height: 28px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .details-toggle[aria-expanded="true"]{ border-color: var(--seal); color: var(--seal-dark); }
  .details.is-hidden{ display:none; }
  .details{ margin-bottom: 14px; }
  .detail-stats{
    font-family:"JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
  }
  .detail-stats b{ color: var(--ink); font-weight:600; }

  .mode-chips{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
    margin: 0 0 10px;
  }
  .mode-chip{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 6px 13px;
    cursor: pointer;
    opacity: 0.5;
  }
  .mode-chip.on{
    opacity: 1;
    border-color: var(--seal);
    color: var(--seal-dark);
    background: rgba(179,53,42,0.07);
  }

  /* Prompt shown instead of (or beside) audio, depending on the mode. */
  .prompt-de{
    font-family:"Source Serif 4", Georgia, serif;
    font-size: 26px;
    line-height: 1.3;
    color: var(--ink);
    margin: 6px 0 16px;
  }
  .prompt-hz{
    font-family:"Noto Serif SC", serif;
    font-size: 52px;
    line-height: 1.2;
    color: var(--ink);
    margin: 6px 0 16px;
    letter-spacing: 0.04em;
  }
  .prompt-hint{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .write-grid{ margin-bottom: 10px; }
  /* One character at a time, as large as the card allows — a thumb-drawn
     hanzi needs room for strokes, so the cell takes the full width. */
  .write-cell{
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1 / 1;
    border: 1.5px solid var(--seal);
    border-radius: 6px;
    background: #fffdf8;
    display:block;
    margin: 0 auto;
    cursor: crosshair;
    /* Without this the browser scrolls the page instead of drawing. */
    touch-action: none;
  }
  .write-cell.is-hidden{ display:none; }
  /* Pager and tools share one row — two separate rows of controls was most of
     the clutter under the writing cell. */
  .write-bar{
    display:flex;
    align-items:center;
    gap: 8px;
    margin: 10px 0 0;
  }
  .write-pager{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    margin-right: auto;
  }
  .write-pager.is-hidden{ display:none; }
  .write-bar .write-pager.is-hidden ~ #undoBtn{ margin-left: auto; }
  .write-pos{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    min-width: 104px;
    text-align:center;
  }
  .write-pos b{ color: var(--ink); }
  .write-tools{
    display:flex;
    gap: 8px;
    align-items:center;
  }
  .write-tool{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    background: transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .write-tool:disabled{ opacity: 0.35; cursor: default; }

  .grid-input-wrap{ margin-bottom: 18px; }
  .grid-label{
    font-family:"JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  textarea.grid-paper{
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font-family: "Noto Serif SC", "JetBrains Mono", monospace;
    font-size: 20px;
    line-height: 34px;
    color: var(--ink);
    padding: 4px 10px;
    border: 1.5px solid var(--seal);
    border-radius: 6px;
    background-color: #fffdf8;
    background-image:
      repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 34px);
    background-position: 0 6px;
    outline: none;
  }
  textarea.grid-paper:focus{
    box-shadow: 0 0 0 3px rgba(179,53,42,0.12);
  }
  textarea.grid-paper::placeholder{
    font-family: "Source Serif 4", serif;
    font-style: italic;
    font-size: 15px;
    color: #a39c8d;
  }

  .reveal-btn, .primary-btn{
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-family: "JetBrains Mono", monospace;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .reveal-btn:hover, .primary-btn:hover{ opacity: 0.85; }

  .answer{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed var(--paper-line);
    animation: rise 0.35s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }
  .hanzi{
    font-family: "Noto Serif SC", serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 6px;
    line-height:1.3;
  }
  .pinyin{
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    color: var(--seal-dark);
    margin: 0 0 10px;
  }
  .meaning{
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .grade-row{ display:flex; gap: 8px; }
  .grade-btn{
    flex:1;
    padding: 12px 6px;
    border-radius: 8px;
    border: 1.5px solid var(--ink-soft);
    background: transparent;
    color: var(--ink);
    font-family:"JetBrains Mono", monospace;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .grade-btn:active{ transform: scale(0.95); }
  .grade-btn.again{ border-color: var(--seal); color: var(--seal-dark); }
  .grade-btn.good{ border-color: var(--ink); }
  .grade-btn.easy{ border-color: var(--jade); color: var(--jade); }

  .voice-warning{
    font-family:"JetBrains Mono", monospace;
    font-size: 12px;
    background: #fff4e9;
    border: 1px solid #d8a35c;
    color: #7a4a13;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    line-height:1.5;
    display:none;
  }
  .voice-warning.show{ display:block; }

  .empty-state{
    text-align:center;
    padding: 40px 10px;
  }
  .empty-state .hanzi-big{
    font-family:"Noto Serif SC", serif;
    font-size: 46px;
    color: var(--jade);
    margin-bottom: 10px;
  }
  .empty-state p{ color: var(--ink-soft); margin: 6px 0 22px; }

  footer{
    margin-top: 22px;
    font-family:"JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .answer{ animation: none; }
    .play-btn, .grade-btn{ transition:none; }
  }

  @media (max-width: 420px){
    .card{ padding: 22px 16px 18px; }
  }

  /* Phone layout: one-handed reach.
     On a phone the top of the card is where the thumb can't go, so the play
     controls move below the writing area, next to the reveal button — the
     cards get replayed constantly, so that button matters more than reading
     order. Ordering is done in CSS rather than in render(), so the desktop
     layout (listen, then write, top to bottom) is untouched.
     .tag is absolutely positioned and unaffected. */
  @media (max-width: 640px){
    /* Declutter: the card should start above the fold, so everything that
       isn't the current question gets shrunk or dropped. */
    h1{ font-size: 24px; }
    h1 .latin{ display:none; }
    .page-footer{ display:none; }
    body{ padding: 14px 14px 24px; }

    .card{ display:flex; flex-direction:column; }
    .grid-input-wrap{ order:1; margin-bottom: 14px; }
    .controls-row{ order:2; margin: 0 0 16px; }
    .reveal-btn{ order:3; }
    #answerBox{ order:4; }
    /* Play sits far right, inside the right thumb's arc. Reordered rather
       than row-reversed, so text still reads left-to-right. */
    .controls-row .rate-toggle{ order:1; margin-right:auto; }
    .controls-row .play-btn{ order:2; }
    /* Bigger tap target now that it's the primary thumb control. */
    .play-btn{ width: 68px; height: 68px; }
    .play-btn svg{ width: 27px; height: 27px; }
  }
</style>
</head>
<body>
<div class="bg-wash"></div>
<div class="grid-wash"></div>

<div class="wrap">
  <header class="topbar">
    <h1>听写 <span class="latin">— Hörverstehen &amp; Vokabeltraining</span></h1>
    <div class="stats" id="stats"></div>
    <button class="details-toggle" id="detailsBtn" aria-expanded="false" aria-label="Details anzeigen">▾</button>
  </header>
  <!-- Set-once controls and status, collapsed so the card starts above the
       fold on a phone. -->
  <div class="details is-hidden" id="details">
    <div class="mode-chips" id="modeChips"></div>
    <div class="boxes" id="boxes"></div>
    <div class="detail-stats" id="detailStats"></div>
  </div>

  <!-- Hidden by default; updateVoiceBanner() fills in the actual reason. -->
  <div class="voice-warning" id="voiceWarning">
    Sprachausgabe eingeschränkt.
  </div>

  <div class="card" id="card"></div>

  <footer class="page-footer">Fortschritt wird auf deinem Server gespeichert und über alle Geräte synchronisiert · Karten stammen aus HSK2/3 (ungefähre Einstufung)</footer>
</div>

// -------- Leitner scheduling --------
const INTERVAL_MS = {
  1: 10 * 60 * 1000,            // 10 min
  2: 1  * 24*60*60*1000,        // 1 day
  3: 3  * 24*60*60*1000,        // 3 days
  4: 7  * 24*60*60*1000,        // 7 days
  5: 21 * 24*60*60*1000,        // 21 days
};
const STORAGE_KEY = 'zh-tingxie-progress';

let progress = {};
let queue = [];
let qIndex = 0;
let revealed = false;
// Playback speed. Sentences default slower than single words: at full speed a
// whole sentence runs together before you can parse it, which is the point at
// which dictation stops training anything. "langsam" is a manual override on
// top, and once switched on it stays on until switched off.
const RATE_SLOW = 0.7;
const RATE_SENTENCE = 0.85;
let slowMode = false;
function baseRate(item){ return item && item.type === 'sentence' ? RATE_SENTENCE : 1; }
function currentRate(){ return slowMode ? RATE_SLOW : baseRate(currentItem()); }
let zhVoice = null;

// Storage abstraction: talks to the /api/progress backend so progress syncs
// across devices. localStorage is kept as an offline cache — reads fall back to
// it when the server is unreachable, writes always land there first so a failed
// request never loses a grading. Every write PUTs the whole progress object,
// so a failed save self-heals on the next one.
// Set localStorage['tingxie-token'] per device if the server runs with
// TINGXIE_TOKEN; not needed behind Cloudflare Access.
const API_URL = '/api/progress';
const Storage = {
  headers(){
    const h = { 'Content-Type': 'application/json' };
    try{
      const t = localStorage.getItem('tingxie-token');
      if(t) h['X-Tingxie-Token'] = t;
    }catch(e){}
    return h;
  },
  async get(key){
    try{
      const res = await fetch(API_URL, { headers: this.headers(), cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const value = JSON.stringify(await res.json());
      try{ localStorage.setItem(key, value); }catch(e){}
      return { key, value, shared: false };
    }catch(e){
      console.warn('Server nicht erreichbar, nutze lokalen Stand', e);
      try{
        const v = localStorage.getItem(key);
        return v ? { key, value: v, shared: false } : null;
      }catch(e2){ return null; }
    }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); }catch(e){}
    try{
      const res = await fetch(API_URL, { method: 'PUT', headers: this.headers(), body: value });
      if(!res.ok) throw new Error('HTTP ' + res.status);
    }catch(e){
      console.warn('Sync fehlgeschlagen, lokal gespeichert', e);
    }
    return { key, value, shared: false };
  }
};

// Before modes existed, progress was keyed by bare item id. Those entries are
// all dictation history, so they become the "listen" mode's boxes; the other
// two modes start fresh. Runs on every load and is idempotent.
function migrateProgress(p){
  let changed = false;
  const out = {};
  for(const [key, value] of Object.entries(p)){
    if(key.includes(':')) out[key] = value;
    else { out[cardKey(key, 'listen')] = value; changed = true; }
  }
  return { progress: out, changed };
}

async function loadProgress(){
  try{
    const res = await Storage.get(STORAGE_KEY);
    if(res && res.value) progress = JSON.parse(res.value);
  }catch(e){ progress = {}; }
  const migrated = migrateProgress(progress);
  progress = migrated.progress;
  // Persist immediately so the old keys don't get re-migrated forever, and so
  // other devices see the new shape.
  if(migrated.changed) saveProgress();
}
async function saveProgress(){
  try{ await Storage.set(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

// ---- Exercise modes --------------------------------------------------------
// Three named exercise types rather than an input×output matrix: the matrix
// produces mostly degenerate pairs and turns the app into a settings screen.
// Sessions mix all enabled modes instead of drilling one at a time.
//
// Each (item, mode) pair schedules independently — recognising 大家 by ear and
// producing it from "alle (Personen)" are different skills that decay at
// different rates, so one shared box would mis-schedule both.
const MODES = [
  { id: 'listen', chip: 'Hören',     tag: 'Hören',     ask: 'Was hast du gehört? Schreib die Zeichen.' },
  { id: 'de2hz',  chip: 'Schreiben', tag: 'Schreiben', ask: 'Wie schreibt man das?' },
  { id: 'hz2de',  chip: 'Lesen',     tag: 'Lesen',     ask: 'Was bedeutet das?' },
];
const MODE_IDS = MODES.map(m => m.id);
const MODES_KEY = 'tingxie-modes';
// Cap on unseen cards per session. With three modes the bank is ~294 cards, so
// without this the first session would introduce every one of them at once.
const NEW_PER_SESSION = 12;

let enabledModes = MODE_IDS.slice();

function loadModes(){
  try{
    const raw = localStorage.getItem(MODES_KEY);
    if(raw){
      const list = JSON.parse(raw).filter(m => MODE_IDS.includes(m));
      if(list.length) enabledModes = list;
    }
  }catch(e){}
}
function saveModes(){
  try{ localStorage.setItem(MODES_KEY, JSON.stringify(enabledModes)); }catch(e){}
}
function modeInfo(id){ return MODES.find(m => m.id === id) || MODES[0]; }

// Not every mode makes sense for every item. Writing a whole sentence in hanzi
// from a German prompt is a translation exercise, not dictation — far beyond
// HSK2/3 and mostly a failure generator.
function modeApplies(mode, item){
  return !(mode === 'de2hz' && item.type === 'sentence');
}

// How the answer is given:
//   canvas — draw the characters (words: producing the character IS the skill)
//   pinyin — type it (sentences: the skill under test is hearing and
//            segmenting, and drawing 10 characters costs far more than it
//            teaches; the word cards already drill those characters)
//   none   — nothing to enter, self-assessed on reveal
function answerFormat(mode, item){
  if(mode === 'hz2de') return 'none';
  return item.type === 'sentence' ? 'pinyin' : 'canvas';
}

// Progress is keyed "<itemId>:<mode>". Item ids never contain ':', so
// splitting on the last one is unambiguous.
function cardKey(id, mode){ return id + ':' + mode; }
function parseKey(key){
  const i = key.lastIndexOf(':');
  return { id: key.slice(0, i), mode: key.slice(i + 1) };
}

function getEntry(key){
  return progress[key] || { box: 0, next: 0, seen: 0, correct: 0 };
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue(){
  const now = Date.now();
  const due = [];
  const fresh = [];
  for(const mode of enabledModes){
    for(const it of ITEMS){
      if(!modeApplies(mode, it)) continue;
      const key = cardKey(it.id, mode);
      const e = progress[key];
      if(!e) fresh.push(key);
      else if((e.next || 0) <= now) due.push(key);
    }
  }
  shuffle(due);
  shuffle(fresh);
  // Mixed, not blocked by mode: reviews and new cards interleave.
  queue = shuffle(due.concat(fresh.slice(0, NEW_PER_SESSION)));
  qIndex = 0;
}

function currentCard(){
  if(qIndex >= queue.length) return null;
  const { id, mode } = parseKey(queue[qIndex]);
  const item = ITEMS.find(it => it.id === id);
  return item ? { item, mode, key: queue[qIndex] } : null;
}

function currentItem(){
  const c = currentCard();
  return c ? c.item : null;
}

function grade(result){
  const card = currentCard();
  if(!card) return;
  const key = card.key;
  const entry = getEntry(key);
  entry.seen = (entry.seen || 0) + 1;
  const now = Date.now();

  if(result === 'again'){
    entry.box = 1;
    entry.next = now + INTERVAL_MS[1];
    progress[key] = entry;
    // requeue a few cards later in this session
    const reinsertAt = Math.min(qIndex + 4, queue.length);
    queue.splice(reinsertAt, 0, key);
  } else {
    entry.correct = (entry.correct || 0) + 1;
    const bump = result === 'easy' ? 2 : 1;
    entry.box = Math.min((entry.box || 0) + bump, 5);
    entry.next = now + INTERVAL_MS[entry.box];
    progress[key] = entry;
  }
  saveProgress();
  qIndex++;
  revealed = false;
  render();
}

let onlineAudio = null;

// Voice preference, best first:
//   1. /api/tts — Microsoft neural voice via the server relay. Best prosody
//      and tones, and identical on every device.
//   2. a local zh voice, if the browser has a real one (phones usually do)
//   3. Google Translate's unofficial endpoint
// serverTts flips to false permanently on the first failure, so a missing or
// broken relay costs one failed request per session, not one per card.
let serverTts = true;

function speak(text, r){
  const spd = r || currentRate();
  if(serverTts){ speakServer(text, spd); return; }
  speakLocalOrOnline(text, spd);
}

function speakLocalOrOnline(text, spd){
  if(zhVoice){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.voice = zhVoice;
    u.rate = spd;
    window.speechSynthesis.speak(u);
    return;
  }
  speakOnline(text, spd);
}

function speakServer(text, spd){
  if(onlineAudio){ onlineAudio.pause(); }
  // The relay re-synthesises at the requested rate rather than resampling,
  // so slow playback keeps its pitch and tones stay intelligible.
  const pct = Math.round((spd - 1) * 100);
  const rateParam = (pct >= 0 ? '+' : '') + pct + '%';
  const url = '/api/tts?text=' + encodeURIComponent(text) + '&rate=' + encodeURIComponent(rateParam);
  onlineAudio = new Audio(url);
  const fallback = () => {
    if(!serverTts) return;
    serverTts = false;
    console.warn('Server-TTS nicht verfügbar, nutze Ersatzstimme');
    updateVoiceBanner();
    speakLocalOrOnline(text, spd);
  };
  onlineAudio.onerror = fallback;
  onlineAudio.play().catch(fallback);
}

function speakOnline(text, r){
  try{
    if(onlineAudio){ onlineAudio.pause(); }
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q='
      + encodeURIComponent(text) + '&tl=zh-CN&client=tw-ob';
    onlineAudio = new Audio(url);
    onlineAudio.playbackRate = r || 1;
    onlineAudio.play().catch(() => {
      document.getElementById('voiceWarning').innerHTML =
        'Keine Sprachausgabe verfügbar (evtl. kein Internet oder blockiert). ' +
        'Prüf deine Verbindung und lade die Seite neu.';
      document.getElementById('voiceWarning').classList.add('show');
    });
  }catch(e){
    console.error('Online-TTS fehlgeschlagen', e);
  }
}

function pickVoice(){
  if(!('speechSynthesis' in window)) { updateVoiceBanner(); return; }
  const voices = window.speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
  updateVoiceBanner();
}
function updateVoiceBanner(){
  const el = document.getElementById('voiceWarning');
  if(serverTts || zhVoice){
    // Neural relay (or a real local voice) — nothing worth warning about.
    el.classList.remove('show');
  } else {
    el.innerHTML = 'Neurale Server-Stimme nicht erreichbar — nutze stattdessen Online-Aussprache ' +
      '(Google Translate, inoffiziell, braucht Internet).';
    el.classList.add('show');
  }
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
} else {
  updateVoiceBanner();
}

function renderStats(){
  const now = Date.now();
  let dueCount = 0;
  let total = 0;
  const boxCounts = [0,0,0,0,0,0]; // 0 = not yet seen
  // Counts follow the enabled modes, so turning a mode off shrinks the deck
  // rather than leaving phantom cards in the totals.
  for(const mode of enabledModes){
    for(const it of ITEMS){
      if(!modeApplies(mode, it)) continue;
      total++;
      const e = progress[cardKey(it.id, mode)];
      if(!e){ boxCounts[0]++; dueCount++; continue; }
      boxCounts[e.box]++;
      if((e.next || 0) <= now) dueCount++;
    }
  }
  // Only the due count earns a place in the top bar; the rest is status.
  document.getElementById('stats').innerHTML = `<span>Fällig: <b>${dueCount}</b></span>`;
  const detail = document.getElementById('detailStats');
  if(detail){
    detail.innerHTML = `Karten gesamt: <b>${total}</b> · Gemeistert: <b>${boxCounts[5]}</b> · Neu: <b>${boxCounts[0]}</b>`;
  }
  const boxesEl = document.getElementById('boxes');
  boxesEl.innerHTML = '';
  for(let b = 1; b <= 5; b++){
    const div = document.createElement('div');
    div.className = 'box-stamp' + (boxCounts[b] > 0 ? ' filled' : '') + (b === 5 ? ' mastered' : '');
    div.innerHTML = `<span class="n">${boxCounts[b]}</span><span>Box ${b}</span>`;
    boxesEl.appendChild(div);
  }
}

function renderModeChips(){
  const el = document.getElementById('modeChips');
  if(!el) return;
  el.innerHTML = '';
  for(const m of MODES){
    const on = enabledModes.includes(m.id);
    const b = document.createElement('button');
    b.className = 'mode-chip' + (on ? ' on' : '');
    b.textContent = m.chip;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.onclick = () => {
      const next = on ? enabledModes.filter(x => x !== m.id) : enabledModes.concat([m.id]);
      if(!next.length) return; // never leave the deck with no modes at all
      enabledModes = MODE_IDS.filter(x => next.includes(x)); // keep canonical order
      saveModes();
      buildQueue();
      revealed = false;
      render();
    };
    el.appendChild(b);
  }
}

function render(){
  renderStats();
  renderModeChips();
  const cardEl = document.getElementById('card');
  const card = currentCard();
  const item = card && card.item;

  if(!item){
    cardEl.innerHTML = `
      <div class="empty-state">
        <div class="hanzi-big">完</div>
        <p>Für jetzt fertig. Alle fälligen Karten wiederholt.</p>
        <button class="primary-btn" id="extraBtn">Trotzdem weiterüben</button>
      </div>
    `;
    document.getElementById('extraBtn').onclick = () => {
      const all = [];
      for(const mode of enabledModes) for(const it of ITEMS){
        if(modeApplies(mode, it)) all.push(cardKey(it.id, mode));
      }
      queue = shuffle(all);
      qIndex = 0;
      revealed = false;
      render();
    };
    cells = [];
    undoOrder = [];
    return;
  }

  const mode = modeInfo(card.mode);
  const tagLabel = `HSK${item.level} · ${item.type === 'word' ? 'Wort' : 'Satz'} · ${mode.tag}`;

  // What the card shows before the reveal. "listen" gives away nothing but the
  // audio; the other two show one side and ask for the other. Audio stays
  // available everywhere, deliberately — in de2hz it's a pronunciation hint,
  // and using it is the learner's call.
  const promptHtml =
    card.mode === 'de2hz' ? `<div class="prompt-de">${item.meaning}</div>` :
    card.mode === 'hz2de' ? `<div class="prompt-hz">${item.hanzi}</div>` : '';

  const format = answerFormat(card.mode, item);
  const wantsWriting = format === 'canvas';
  const askLabel = format === 'pinyin'
    ? 'Was hast du gehört? Schreib es in Pinyin (ohne Töne).'
    : mode.ask;

  const pinyinHtml = `
    <div class="grid-input-wrap">
      <div class="grid-label">${askLabel}</div>
      <textarea class="grid-paper" id="pinyinInput" rows="2"
        autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
        placeholder="z. B. women mingtian qu beijing"></textarea>
    </div>
  `;

  const answerAreaHtml = wantsWriting ? `
    <div class="grid-input-wrap">
      <div class="grid-label">${askLabel}</div>
      <div class="write-grid" id="writeGrid"></div>
      <div class="write-bar">
        <span class="write-pager" id="writePager">
          <button class="write-tool" id="prevCharBtn" aria-label="Vorheriges Zeichen">‹</button>
          <span class="write-pos" id="writePos"></span>
          <button class="write-tool" id="nextCharBtn" aria-label="Nächstes Zeichen">›</button>
        </span>
        <button class="write-tool" id="undoBtn" aria-label="Letzten Strich zurücknehmen">↶</button>
        <button class="write-tool" id="clearBtn" aria-label="Alles löschen">löschen</button>
      </div>
    </div>
  ` : format === 'pinyin'
    ? pinyinHtml
    : `<div class="prompt-hint">${mode.ask} Überleg dir die Antwort, dann aufdecken.</div>`;

  cardEl.innerHTML = `
    <div class="tag">${tagLabel}</div>
    ${promptHtml}
    <div class="controls-row">
      <button class="play-btn" id="playBtn" aria-label="Abspielen">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/></svg>
      </button>
      <button class="rate-toggle ${slowMode ? 'active' : ''}" id="rateBtn">langsam</button>
    </div>

    ${answerAreaHtml}

    <button class="reveal-btn" id="revealBtn">Antwort zeigen</button>

    <div id="answerBox"></div>
  `;

  if(wantsWriting){
    buildWriteGrid(item);
  } else {
    cells = [];
    undoOrder = [];
  }

  document.getElementById('playBtn').onclick = () => speak(item.hanzi);
  document.getElementById('rateBtn').onclick = (e) => {
    slowMode = !slowMode;
    e.target.classList.toggle('active', slowMode);
    speak(item.hanzi);
  };
  document.getElementById('revealBtn').onclick = () => {
    revealed = true;
    showAnswer(item);
  };

  if(revealed) showAnswer(item);
}

// ---- Handwriting input -----------------------------------------------------
// One canvas per character of the answer, drawn on a 米字格 guide. Nothing is
// recognised or persisted: the drawing is scratch paper, and grading stays
// self-assessed after the reveal, same as before.

const HANZI_RE = /[㐀-䶿一-鿿]/; // ideographs only; punctuation gets no cell

// Strokes are stored in a fixed logical coordinate space, not in pixels, so
// they survive resizing, rotation and DPR differences: the canvas backing
// store is rebuilt from the element's real size and the strokes are simply
// redrawn. undoOrder records which cell each stroke went into, so "rückgängig"
// walks back through the whole word rather than one cell at a time.
const LOGICAL = 300;

let cells = [];
let undoOrder = [];
let activeCell = 0;

function drawGuides(ctx){
  ctx.save();
  ctx.strokeStyle = 'rgba(185,195,207,0.9)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([9, 9]);
  ctx.beginPath();
  ctx.moveTo(LOGICAL / 2, 0); ctx.lineTo(LOGICAL / 2, LOGICAL);   // vertical
  ctx.moveTo(0, LOGICAL / 2); ctx.lineTo(LOGICAL, LOGICAL / 2);   // horizontal
  ctx.moveTo(0, 0); ctx.lineTo(LOGICAL, LOGICAL);                 // diagonals
  ctx.moveTo(LOGICAL, 0); ctx.lineTo(0, LOGICAL);
  ctx.stroke();
  ctx.restore();
}

// Match the backing store to the element's rendered size. Must run after
// layout, and again whenever the element can have changed size.
function sizeCell(cell){
  const rect = cell.canvas.getBoundingClientRect();
  if(!rect.width) return false;
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(rect.width * dpr);
  if(cell.canvas.width !== px){
    cell.canvas.width = px;
    cell.canvas.height = px;
  }
  const scale = px / LOGICAL;
  cell.ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return true;
}

function redrawCell(cell){
  const { ctx, strokes } = cell;
  ctx.clearRect(0, 0, LOGICAL, LOGICAL);
  drawGuides(ctx);
  ctx.save();
  ctx.strokeStyle = '#211f1a';
  ctx.fillStyle = '#211f1a';
  ctx.lineWidth = LOGICAL * 0.045;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for(const stroke of strokes){
    if(stroke.length < 2){
      // A tap is still ink — draw it as a dot rather than dropping it.
      ctx.beginPath();
      ctx.arc(stroke[0].x, stroke[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for(let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
    ctx.stroke();
  }
  ctx.restore();
}

function updateWriteTools(){
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  if(!undoBtn) return;
  const empty = undoOrder.length === 0;
  undoBtn.disabled = empty;
  clearBtn.disabled = empty;
}

function makeCell(){
  const canvas = document.createElement('canvas');
  canvas.className = 'write-cell';
  const ctx = canvas.getContext('2d');

  const cell = { canvas, ctx, strokes: [] };
  let drawing = null;

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * LOGICAL,
      y: ((e.clientY - r.top) / r.height) * LOGICAL,
    };
  };

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    // Capture keeps a stroke tracking the finger if it slides outside the
    // cell. Not fatal if the browser refuses, so don't let it abort the stroke.
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    drawing = [pos(e)];
    cell.strokes.push(drawing);
    undoOrder.push(cell);
    redrawCell(cell);
    updateWriteTools();
  });
  canvas.addEventListener('pointermove', (e) => {
    if(!drawing) return;
    e.preventDefault();
    drawing.push(pos(e));
    redrawCell(cell);
  });
  const end = () => { drawing = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);

  return cell;
}

function showCell(i){
  if(!cells.length) return;
  activeCell = Math.max(0, Math.min(i, cells.length - 1));
  cells.forEach((c, n) => c.canvas.classList.toggle('is-hidden', n !== activeCell));
  const pos = document.getElementById('writePos');
  if(pos) pos.innerHTML = 'Zeichen <b>' + (activeCell + 1) + '</b> / ' + cells.length;
  const prev = document.getElementById('prevCharBtn');
  const next = document.getElementById('nextCharBtn');
  if(prev) prev.disabled = activeCell === 0;
  if(next) next.disabled = activeCell === cells.length - 1;
  // Sizing has to happen while visible: a display:none canvas measures 0.
  const cell = cells[activeCell];
  if(sizeCell(cell)) redrawCell(cell);
}

function buildWriteGrid(item){
  const grid = document.getElementById('writeGrid');
  if(!grid) return;
  grid.innerHTML = '';
  cells = [];
  undoOrder = [];
  activeCell = 0;

  const chars = Array.from(item.hanzi).filter(c => HANZI_RE.test(c));
  for(let i = 0; i < chars.length; i++){
    const cell = makeCell();
    cells.push(cell);
    grid.appendChild(cell.canvas);
  }

  const pager = document.getElementById('writePager');
  // A single-character word needs no navigation.
  if(pager) pager.classList.toggle('is-hidden', cells.length < 2);
  const prev = document.getElementById('prevCharBtn');
  const next = document.getElementById('nextCharBtn');
  if(prev) prev.onclick = () => showCell(activeCell - 1);
  if(next) next.onclick = () => showCell(activeCell + 1);

  document.getElementById('undoBtn').onclick = () => {
    const cell = undoOrder.pop();
    if(!cell) return;
    cell.strokes.pop();
    // Jump to wherever that stroke was, so undo is never invisible.
    const idx = cells.indexOf(cell);
    if(idx !== -1 && idx !== activeCell) showCell(idx);
    else redrawCell(cell);
    updateWriteTools();
  };
  document.getElementById('clearBtn').onclick = () => {
    for(const c of cells) c.strokes = [];
    undoOrder = [];
    showCell(0);
    for(const c of cells) if(sizeCell(c)) redrawCell(c);
    updateWriteTools();
  };

  showCell(0);
  // Fonts and layout can settle a frame later; re-measure once.
  requestAnimationFrame(() => showCell(activeCell));
  updateWriteTools();
}

// Rotation and window resizes change the cell's pixel size; strokes are in
// logical units, so a re-measure plus redraw is all that's needed.
window.addEventListener('resize', () => {
  if(!cells.length) return;
  const cell = cells[activeCell];
  if(sizeCell(cell)) redrawCell(cell);
});

function showAnswer(item){
  const box = document.getElementById('answerBox');
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.style.display = 'none';
  box.innerHTML = `
    <div class="answer">
      <p class="hanzi">${item.hanzi}</p>
      <p class="pinyin">${item.pinyin}</p>
      <p class="meaning">${item.meaning}</p>
      <div class="grade-row">
        <button class="grade-btn again" id="gAgain">Nochmal</button>
        <button class="grade-btn good" id="gGood">Gut</button>
        <button class="grade-btn easy" id="gEasy">Einfach</button>
      </div>
    </div>
  `;
  document.getElementById('gAgain').onclick = () => grade('again');
  document.getElementById('gGood').onclick = () => grade('good');
  document.getElementById('gEasy').onclick = () => grade('easy');
}

// Disclosure for modes/boxes/totals. Collapsed by default; the choice sticks
// per device, since it's a UI preference rather than progress.
const DETAILS_KEY = 'tingxie-details';
function setDetails(open){
  const panel = document.getElementById('details');
  const btn = document.getElementById('detailsBtn');
  if(!panel || !btn) return;
  panel.classList.toggle('is-hidden', !open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.textContent = open ? '▴' : '▾';
  try{ localStorage.setItem(DETAILS_KEY, open ? '1' : '0'); }catch(e){}
}
document.getElementById('detailsBtn').onclick = () => {
  const open = document.getElementById('detailsBtn').getAttribute('aria-expanded') === 'true';
  setDetails(!open);
};

(async function init(){
  loadModes();
  let open = false;
  try{ open = localStorage.getItem(DETAILS_KEY) === '1'; }catch(e){}
  setDetails(open);
  await loadProgress();
  buildQueue();
  render();
})();
</script>
