# No-build deployment: runs the stock node image with the source bind-mounted,
# instead of building a local image. Use this with Dockge or a TrueNAS custom
# app — neither can build from a Dockerfile.
#
# Works because the project has zero dependencies: there is nothing to install,
# so an image build would only be copying two files in. Updating is
# `git pull && docker compose restart` — no rebuild, ever.
#
# Requires the repo checked out on the host, with ./data writable by uid 1000.

services:
  tingxie:
    image: node:22-alpine
    container_name: tingxie
    restart: unless-stopped
    command: node /app/server.js
    working_dir: /app
    # Must be an id that can read the source and write ./data. On TrueNAS the
    # dataset is rarely owned by uid 1000, and a mismatch shows up as a
    # confusing "Cannot find module '/app/server.js'" — Node reports a
    # permission failure on the parent directory as MODULE_NOT_FOUND.
    # Set TINGXIE_UID/GID in .env to the dataset owner; see DEPLOY.md.
    user: "${TINGXIE_UID:-1000}:${TINGXIE_GID:-1000}"
    ports:
      # Host port only; the container always listens on 8080 internally.
      # 8080 on the host is taken on TrueNAS, hence the default of 8477.
      #
      # Bound to all interfaces because cloudflared reaches origins over the
      # host's LAN IP, not loopback — matching how the other tunnel routes on
      # this box are configured. The cost is that anyone on the LAN can reach
      # the app directly, bypassing Cloudflare Access. Set TINGXIE_BIND to
      # 127.0.0.1 to close that off (only works if cloudflared runs as a host
      # service), or put cloudflared on this Docker network and route it to
      # tingxie:8080 instead.
      - "${TINGXIE_BIND:-0.0.0.0}:${TINGXIE_PORT:-8477}:8080"
    volumes:
      - ./:/app:ro          # source, read-only — the app never writes here
      - ./data:/data        # progress.json lives here
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      TINGXIE_TOKEN: "${TINGXIE_TOKEN:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
